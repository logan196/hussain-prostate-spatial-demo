<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prostate Spatial Atlas · Novaflow</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#070a0e;--panel:#0d121a;--panel2:#111825;--line:#1b2330;--line2:#27313f;--tx:#e9eef6;--mut:#9aa6b6;--mut2:#5d6878;--blue:#4f8cff;--cyan:#38bdf8;--vio:#7c6cff;--grn:#34d399;--amb:#f5a623;--red:#f87171;
--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;--sans:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
html,body{background:var(--bg);color:var(--tx);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:var(--cyan);text-decoration:none}a:hover{text-decoration:underline}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:18px;padding:10px 24px;background:rgba(10,14,19,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top img{height:19px}.top .ttl{font-weight:640;font-size:14.5px;letter-spacing:-.01em}.top .ttl span{color:var(--mut);font-weight:400}
.top nav{display:flex;gap:14px;font-size:12.5px}.top nav a{color:var(--mut)}.top nav a:hover,.top nav a.on{color:var(--tx);text-decoration:none}
.sbox{position:relative;flex:1;max-width:440px;margin-left:auto}
.sbox input{width:100%;background:var(--panel);border:1px solid var(--line2);border-radius:9px;color:var(--tx);padding:8px 12px 8px 32px;font:13px var(--sans);outline:none}
.sbox input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(79,140,255,.18)}
.sbox:before{content:"⌕";position:absolute;left:11px;top:5px;color:var(--mut2);font-size:16px}
.sug{position:absolute;top:40px;left:0;right:0;background:var(--panel);border:1px solid var(--line2);border-radius:9px;overflow:hidden;display:none;box-shadow:0 12px 40px rgba(0,0,0,.5)}
.sug div{padding:7px 12px;cursor:pointer;display:flex;gap:10px;font-size:12.5px}.sug div:hover,.sug div.on{background:var(--panel2)}
.sug b{font-family:var(--mono);min-width:86px}.sug span{color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
main{max-width:1440px;margin:0 auto;padding:22px 24px 60px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.h{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut2);margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.hero{position:relative;overflow:hidden;padding:26px 28px;border-radius:14px;border:1px solid var(--line);background:radial-gradient(circle at 88% 0%,rgba(124,108,255,.28),transparent 50%),radial-gradient(circle at 0% 100%,rgba(56,189,248,.12),transparent 50%),#0a0e14;margin-bottom:18px}
.hero h1{font-size:28px;letter-spacing:-.02em;font-weight:680}.hero p{color:var(--mut);max-width:80ch;margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{font-family:var(--mono);font-size:11.5px;border:1px solid var(--line2);border-radius:7px;padding:3px 9px;color:var(--mut);background:rgba(13,18,26,.6);cursor:pointer}
.chip:hover{border-color:var(--blue);color:var(--tx)}.chip.ar{color:#ff8a65;border-color:#4a2a22}.chip.ne{color:#6aa8ff;border-color:#1e3253}
.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-top:18px}
.stat .v{font-family:var(--mono);font-size:20px;font-weight:650}.stat .l{font-size:11.5px;color:var(--mut)}
table{width:100%;border-collapse:collapse;font-size:12.8px}
th{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut2);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line2);cursor:pointer;white-space:nowrap;position:sticky;top:56px;background:var(--panel)}
th:hover{color:var(--tx)}td{padding:6px 10px;border-bottom:1px solid var(--line)}tr.r{cursor:pointer}tr.r:hover td{background:var(--panel2)}
td.g{font-family:var(--mono);font-weight:620;color:var(--tx)}td.n{color:var(--mut);max-width:420px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}td.num{font-family:var(--mono);text-align:right}th.num{text-align:right}
.tag{font-family:var(--mono);font-size:10px;border-radius:5px;padding:1px 6px;font-weight:600}.tag.AR{background:rgba(228,87,46,.16);color:#ff8a65}.tag.NE{background:rgba(46,134,222,.18);color:#6aa8ff}
.filt{display:flex;gap:10px;align-items:center;margin-bottom:10px;font-size:12.5px;color:var(--mut)}
.filt input,.filt select{background:var(--bg);border:1px solid var(--line2);border-radius:7px;color:var(--tx);padding:6px 9px;font:12.5px var(--sans)}
.btn{background:var(--panel2);border:1px solid var(--line2);color:var(--tx);border-radius:7px;padding:6px 12px;cursor:pointer;font:12.5px var(--sans)}.btn:hover{border-color:var(--blue)}
/* gene page */
.gh{display:flex;gap:24px;align-items:flex-end;flex-wrap:wrap;margin-bottom:16px}
.gh .sym{font-size:40px;font-weight:720;letter-spacing:-.03em;font-family:var(--sans);line-height:1}
.gh .nm{font-size:16px;color:var(--mut);margin-top:6px}.gh .meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;font-family:var(--mono);font-size:11.5px;color:var(--mut)}
.gh .meta span{border:1px solid var(--line2);border-radius:6px;padding:2px 8px}
.links{display:flex;gap:8px;margin-left:auto}.links a{font-size:12px;border:1px solid var(--line2);border-radius:8px;padding:6px 11px;color:var(--tx);background:var(--panel)}.links a:hover{border-color:var(--cyan);text-decoration:none}
.kpis{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;margin-bottom:16px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px}.kpi .v{font-family:var(--mono);font-size:18px;font-weight:650}.kpi .l{font-size:11px;color:var(--mut)}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:16px}
@media(max-width:1100px){.grid{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(3,1fr)}.stats{grid-template-columns:repeat(3,1fr)}}
.viewer{position:relative;height:640px;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#05070a}
.viewer canvas{position:absolute;inset:0;width:100%;height:100%;cursor:grab}.viewer canvas:active{cursor:grabbing}
.vt{position:absolute;left:12px;top:12px;display:flex;gap:6px;flex-wrap:wrap;z-index:3}
.seg{display:flex;background:rgba(13,18,26,.85);border:1px solid var(--line2);border-radius:8px;overflow:hidden}
.seg button{background:none;border:0;color:var(--mut);padding:5px 10px;font:12px var(--sans);cursor:pointer}.seg button.on{background:var(--blue);color:#fff}
.vr{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:6px;z-index:3}
.vr button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line2);background:rgba(13,18,26,.85);color:var(--tx);cursor:pointer;font-size:15px}
.vctl{position:absolute;left:12px;bottom:12px;display:flex;gap:14px;align-items:center;background:rgba(13,18,26,.85);border:1px solid var(--line2);border-radius:8px;padding:6px 12px;font-size:11.5px;color:var(--mut);z-index:3}
.vctl input[type=range]{width:90px;accent-color:var(--blue)}.vctl label{display:flex;gap:5px;align-items:center}
.cbar{position:absolute;right:12px;bottom:12px;background:rgba(13,18,26,.85);border:1px solid var(--line2);border-radius:8px;padding:7px 10px;font-family:var(--mono);font-size:10.5px;color:var(--mut);z-index:3;min-width:170px}
.cbar .bar{height:8px;border-radius:4px;margin:4px 0 2px}.cbar .ends{display:flex;justify-content:space-between}
.scale{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);font-family:var(--mono);font-size:10.5px;color:#dfe6f0;text-align:center;z-index:3;text-shadow:0 1px 4px #000}
.scale div{height:3px;background:#fff;border-radius:2px;margin-bottom:3px;box-shadow:0 1px 4px #000}
.tip{position:absolute;pointer-events:none;z-index:5;font-family:var(--mono);font-size:11px;background:rgba(7,10,14,.95);border:1px solid var(--line2);border-radius:7px;padding:6px 9px;display:none;white-space:nowrap}
.rb{display:grid;grid-template-columns:118px 1fr 64px;gap:8px;align-items:center;font-size:12.5px;margin:6px 0}
.rb .lab{display:flex;align-items:center;gap:7px;color:var(--tx)}.rb .lab i{width:9px;height:9px;border-radius:3px;flex:none}
.rb .track{height:16px;background:var(--bg);border-radius:4px;position:relative;overflow:hidden}.rb .fill{position:absolute;left:0;top:0;bottom:0;border-radius:4px}
.rb .val{font-family:var(--mono);font-size:11.5px;text-align:right;color:var(--tx)}.rb .val small{display:block;color:var(--mut2);font-size:10px;line-height:1.1}
.cb{display:flex;align-items:flex-end;gap:4px;height:120px;padding-top:6px}.cb div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-family:var(--mono);font-size:9.5px;color:var(--mut2)}
.cb span{width:100%;border-radius:3px 3px 0 0;background:linear-gradient(180deg,var(--cyan),var(--blue))}
.cor{display:grid;grid-template-columns:1fr 1fr;gap:2px 18px}.cor a{display:grid;grid-template-columns:90px 1fr 46px;gap:8px;align-items:center;padding:4px 6px;border-radius:6px;color:var(--tx);font-size:12.5px}
.cor a:hover{background:var(--panel2);text-decoration:none}.cor b{font-family:var(--mono);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.cor .t{height:6px;background:var(--bg);border-radius:3px;overflow:hidden}.cor .t i{display:block;height:100%;background:var(--vio)}.cor em{font-family:var(--mono);font-style:normal;color:var(--mut);text-align:right;font-size:11.5px}
.prov{display:grid;grid-template-columns:150px 1fr;gap:5px 14px;font-size:12.5px}.prov dt{color:var(--mut)}.prov dd{font-family:var(--mono);font-size:12px;word-break:break-word}
.note{font-size:11.5px;color:var(--mut2);margin-top:8px;line-height:1.45}
.sec{margin-top:16px}.two{display:grid;grid-template-columns:1.3fr 1fr;gap:16px}@media(max-width:1100px){.two{grid-template-columns:1fr}}
.load{color:var(--mut);padding:40px;text-align:center}
</style></head><body>

<main id="app"><div class="load">Loading atlas…</div></main>
<script>
const RCOL=["#e4572e","#f4a261","#a855f7","#64748b","#7dd3fc","#2e86de"];
const MAGMA=[[0,0,4],[28,16,68],[79,18,123],[129,37,129],[181,54,122],[229,80,100],[251,135,97],[254,194,135],[252,253,191]];
const CMAPS={magma:MAGMA,viridis:[[68,1,84],[72,40,120],[62,74,137],[49,104,142],[38,130,142],[31,158,137],[53,183,121],[109,205,89],[180,222,44],[253,231,37]],
 ice:[[4,8,20],[12,40,90],[20,90,170],[56,160,230],[140,215,250],[235,250,255]]};
let M,GI,COLS,BYSYM={},EX={},DT={},img=new Image();
const $=s=>document.querySelector(s),fmt=(v,d=2)=>v==null||isNaN(v)?"–":(+v).toFixed(d);
function cmap(name,t){const c=CMAPS[name];t=Math.max(0,Math.min(1,t))*(c.length-1);const i=Math.min(Math.floor(t),c.length-2),f=t-i;return c[i].map((v,k)=>Math.round(v+(c[i+1][k]-v)*f))}
function grad(name){return "linear-gradient(90deg,"+CMAPS[name].map((c,i,a)=>`rgb(${c})${(100*i/(a.length-1)).toFixed(0)}%`).join(",")+")"}
async function boot(){
 [M,GI]=await Promise.all([fetch("atlas/meta.json").then(r=>r.json()),fetch("atlas/genes.json").then(r=>r.json())]);
 COLS=GI.cols;GI.rows.forEach((r,i)=>{r.i=i;BYSYM[r[0].toUpperCase()]=r;BYSYM[r[1]]=r});
 img.src="atlas/tissue_hires.jpg";await img.decode();
 search();window.onhashchange=route;route();
}
async function expr(gi){const s=Math.floor(gi/GI.shard);if(!EX[s])EX[s]=fetch(`atlas/expr/${String(s).padStart(3,"0")}.bin`).then(r=>r.arrayBuffer()).then(b=>new Uint8Array(b));
 const a=await EX[s],o=(gi%GI.shard)*M.n;return a.subarray(o,o+M.n)}
async function detail(sym,gi){const s=Math.floor(gi/GI.shard);if(!DT[s])DT[s]=fetch(`atlas/detail/${String(s).padStart(3,"0")}.json`).then(r=>r.json());return (await DT[s])[sym]}
function search(){const q=$("#q"),sg=$("#sug");let sel=0,res=[];
 const run=()=>{const t=q.value.trim().toUpperCase();if(!t){sg.style.display="none";return}
  res=GI.rows.filter(r=>r[0].toUpperCase().startsWith(t)||r[1]==t).slice(0,6);
  if(res.length<10)res=res.concat(GI.rows.filter(r=>!res.includes(r)&&(r[0].toUpperCase().includes(t)||r[2].toUpperCase().includes(t))).slice(0,10-res.length));
  sel=0;sg.innerHTML=res.map((r,i)=>`<div class="${i?"":"on"}" data-s="${r[0]}"><b>${r[0]}</b><span>${r[2]||r[1]}</span></div>`).join("");sg.style.display=res.length?"block":"none";
  sg.querySelectorAll("div").forEach(d=>d.onmousedown=()=>go(d.dataset.s))};
 const go=s=>{location.hash="#/gene/"+s;q.value="";sg.style.display="none";q.blur()};
 q.oninput=run;q.onblur=()=>setTimeout(()=>sg.style.display="none",150);
 q.onkeydown=e=>{const d=sg.querySelectorAll("div");if(e.key=="ArrowDown"||e.key=="ArrowUp"){sel=(sel+(e.key=="ArrowDown"?1:-1)+d.length)%d.length;d.forEach((x,i)=>x.classList.toggle("on",i==sel));e.preventDefault()}
  if(e.key=="Enter"&&res[sel])go(res[sel][0])};
 document.addEventListener("keydown",e=>{if(e.key=="/"&&document.activeElement!=q){q.focus();e.preventDefault()}});
}
function route(){const h=decodeURIComponent(location.hash.slice(1));const m=h.match(/^\/gene\/(.+)$/);window.scrollTo(0,0);
 $("#navidx").classList.toggle("on",!m);if(m&&BYSYM[m[1].toUpperCase()])genePage(BYSYM[m[1].toUpperCase()]);else indexPage()}
/* ---------- index ---------- */
let IST={sort:"pct",dir:-1,f:"",p:"",lim:200};
function indexPage(){const P=M.provenance;
 const feat=["KLK3","AR","NKX3-1","TMPRSS2","FOLH1","CHGA","SYP","ASCL1","INSM1","MKI67","SOX2","FOXA2","EZH2","RB1","TP53","HGF","ELN"].filter(g=>BYSYM[g]);
 $("#app").innerHTML=`<div class="hero"><h1>Adenocarcinoma and neuroendocrine prostate cancer, gene by gene, in situ</h1>
 <p>Gene-centric atlas of one Visium CytAssist FFPE section where de novo NEPC co-exists with AR-driven adenocarcinoma (GSE230282). Each gene has a zoomable H&amp;E expression map, expression by tissue region and Leiden cluster, NE-vs-AR differential statistics and its most correlated genes.</p>
 <div class="chips">${feat.map(g=>`<span class="chip ${BYSYM[g][5]=="AR"?"ar":BYSYM[g][5]=="NE"?"ne":""}" onclick="location.hash='#/gene/${g}'">${g}</span>`).join("")}</div>
 <div class="stats">${[[P.genes.toLocaleString(),"genes indexed"],[P.spots_qc.toLocaleString(),"spots after QC"],[M.region_n[0],"AR-region spots"],[M.region_n[5],"NE-region spots"],[(P.median_umi/1000).toFixed(1)+"k","median UMI / spot"],[M.clusters.length,"Leiden clusters"]].map(([v,l])=>`<div class="stat"><div class="v">${v}</div><div class="l">${l}</div></div>`).join("")}</div></div>
 <div class="card"><div class="h"><span>Gene index</span><span id="cnt"></span></div>
 <div class="filt"><input id="f" placeholder="filter…" value="${IST.f}" style="width:240px"><select id="p"><option value="">all genes</option><option value="AR">AR program</option><option value="NE">NE program</option><option value="up">NE-enriched (log2FC>1)</option><option value="dn">AR-enriched (log2FC<−1)</option></select>
 <span style="margin-left:auto">click a column to sort · click a row to open the gene</span></div>
 <table><thead><tr>${[["symbol","Symbol"],["name","Name"],["program","Program"],["pct","% spots",1],["mean","Mean log1p",1],["lfc_NE_vs_AR","log2FC NE/AR",1],["r_AR","r (AR score)",1],["r_NE","r (NE score)",1]].map(([k,l,n])=>`<th data-k="${k}" class="${n?"num":""}">${l}${IST.sort==k?(IST.dir<0?" ↓":" ↑"):""}</th>`).join("")}</tr></thead><tbody id="tb"></tbody></table>
 <div style="text-align:center;margin-top:12px"><button class="btn" id="more">Show more</button></div></div>`;
 $("#p").value=IST.p;
 const draw=()=>{const k=COLS.indexOf(IST.sort),f=IST.f.toUpperCase();
  let rows=GI.rows.filter(r=>(!f||r[0].toUpperCase().includes(f)||r[2].toUpperCase().includes(f)||r[1]==f)&&(!IST.p||(IST.p=="up"?r[8]>1:IST.p=="dn"?r[8]<-1:r[5]==IST.p)));
  rows.sort((a,b)=>{const x=a[k],y=b[k];if(x==null)return 1;if(y==null)return -1;return (x>y?1:x<y?-1:0)*IST.dir});
  $("#cnt").textContent=rows.length.toLocaleString()+" genes";
  $("#tb").innerHTML=rows.slice(0,IST.lim).map(r=>`<tr class="r" data-s="${r[0]}"><td class="g">${r[0]}</td><td class="n">${r[2]}</td><td>${r[5]?`<span class="tag ${r[5]}">${r[5]}</span>`:""}</td><td class="num">${fmt(r[6],1)}</td><td class="num">${fmt(r[7],2)}</td><td class="num" style="color:${r[8]>1?"#6aa8ff":r[8]<-1?"#ff8a65":"inherit"}">${fmt(r[8],2)}</td><td class="num">${fmt(r[9],2)}</td><td class="num">${fmt(r[10],2)}</td></tr>`).join("");
  $("#more").style.display=rows.length>IST.lim?"":"none";
  document.querySelectorAll("tr.r").forEach(t=>t.onclick=()=>location.hash="#/gene/"+t.dataset.s)};
 document.querySelectorAll("th").forEach(t=>t.onclick=()=>{const k=t.dataset.k;IST.dir=IST.sort==k?-IST.dir:(k=="symbol"||k=="name"?1:-1);IST.sort=k;indexPage()});
 $("#f").oninput=e=>{IST.f=e.target.value;IST.lim=200;draw()};$("#p").onchange=e=>{IST.p=e.target.value;IST.lim=200;draw()};$("#more").onclick=()=>{IST.lim+=500;draw()};draw();
}
/* ---------- gene page ---------- */
let V=null;
async function genePage(r){const [sym,ens,name,ent,loc,prog]=r,P=M.provenance;
 const [d,q]=await Promise.all([detail(sym,r.i),expr(r.i)]);const val=Float32Array.from(q,v=>v*d.scale);
 document.title=sym+" · Prostate Spatial Atlas";
 const maxR=Math.max(...d.reg_mean,1e-6),maxC=Math.max(...d.cl_mean,1e-6);
 $("#app").innerHTML=`<div class="gh"><div><div class="h" style="margin:0 0 8px">Gene</div><div class="sym">${sym}</div><div class="nm">${name||"(no HGNC name)"}</div>
 <div class="meta"><span>${ens}</span>${ent?`<span>Entrez ${ent}</span>`:""}${loc?`<span>${loc}</span>`:""}${prog?`<span class="tag ${prog}" style="padding:2px 8px">${prog} program gene</span>`:""}</div></div>
 <div class="links">${ent?`<a target="_blank" href="https://www.ncbi.nlm.nih.gov/gene/${ent}">NCBI Gene ↗</a>`:""}<a target="_blank" href="https://www.genecards.org/cgi-bin/carddisp.pl?gene=${encodeURIComponent(sym)}">GeneCards ↗</a><a target="_blank" href="https://www.proteinatlas.org/${ens}">HPA ↗</a><a target="_blank" href="https://www.ensembl.org/Homo_sapiens/Gene/Summary?g=${ens}">Ensembl ↗</a></div></div>
 <div class="kpis">${[[fmt(r[6],1)+"%","spots detected"],[fmt(r[7],3),"mean log1p (all spots)"],[fmt(d.max,2),"max log1p"],[fmt(r[8],2),"log2FC NE vs AR region"],[d.padj==null?"–":d.padj.toExponential(1),"adj. p (Wilcoxon, spots)"],[fmt(r[9],2),"r with AR score"],[fmt(r[10],2),"r with NE score"]].map(([v,l])=>`<div class="kpi"><div class="v">${v}</div><div class="l">${l}</div></div>`).join("")}</div>
 <div class="grid"><div class="viewer" id="vw"><canvas id="cv"></canvas>
  <div class="vt"><div class="seg" id="mode"><button data-m="expr" class="on">${sym} expression</button><button data-m="region">Regions</button><button data-m="cl">Clusters</button><button data-m="he">H&amp;E only</button></div>
  <div class="seg" id="cm"><button data-c="magma" class="on">magma</button><button data-c="viridis">viridis</button><button data-c="ice">ice</button></div></div>
  <div class="vr"><button id="zi" title="zoom in">+</button><button id="zo" title="zoom out">−</button><button id="zr" title="reset">⟲</button></div>
  <div class="vctl"><label>opacity <input id="op" type="range" min="0" max="100" value="85"></label><label>spot <input id="sz" type="range" min="40" max="140" value="100"></label><label><input id="hz" type="checkbox" checked> hide zero</label></div>
  <div class="cbar" id="cbar"></div><div class="scale" id="scale"></div><div class="tip" id="tip"></div></div>
 <div style="display:flex;flex-direction:column;gap:16px">
  <div class="card"><div class="h"><span>Expression by region</span><span>mean log1p · % spots</span></div>
   ${M.regions.map((g,i)=>`<div class="rb"><div class="lab"><i style="background:${RCOL[i]}"></i>${g}</div><div class="track"><div class="fill" style="width:${100*d.reg_mean[i]/maxR}%;background:${RCOL[i]}"></div></div><div class="val">${fmt(d.reg_mean[i],2)}<small>${fmt(d.reg_pct[i],0)}% · n=${M.region_n[i]}</small></div></div>`).join("")}
   <div class="note">Regions: AR/NE = program z&gt;${P.z_threshold}; boundary = other spots touching an AR- or NE-region spot; stroma/other = remaining spots.</div></div>
  <div class="card"><div class="h"><span>By Leiden cluster</span><span>mean log1p</span></div>
   <div class="cb">${d.cl_mean.map((v,i)=>`<div title="cluster ${M.clusters[i]}: ${fmt(v,3)} · ${fmt(d.cl_pct[i],0)}% · n=${M.cluster_n[i]}"><span style="height:${Math.max(2,100*v/maxC)}%"></span>${M.clusters[i]}</div>`).join("")}</div></div>
 </div></div>
 <div class="two sec"><div class="card"><div class="h"><span>Most correlated genes</span><span>Pearson r across ${M.n.toLocaleString()} spots</span></div>
  <div class="cor">${d.cor.map(([g,v])=>`<a href="#/gene/${g}"><b>${g}</b><span class="t"><i style="width:${Math.max(0,v)*100}%"></i></span><em>${v.toFixed(2)}</em></a>`).join("")}</div>
  ${r[6]<5?`<div class="note" style="color:#f5a623">⚠ ${sym} is detected in only ${fmt(r[6],1)}% of spots; correlations are low-confidence.</div>`:""}<div class="note">Partners restricted to genes detected in ≥5% of spots. Spot-level correlation of log-normalised expression; spots mix several cells, so co-localised cell types also correlate.</div></div>
 <div class="card"><div class="h"><span>Dataset &amp; provenance</span></div><dl class="prov">
  <dt>Dataset</dt><dd><a target="_blank" href="https://www.ncbi.nlm.nih.gov/geo/query/acc.cgi?acc=${P.geo}">${P.geo}</a> · ${P.gsm}</dd>
  <dt>Publication</dt><dd>Watanabe R et al., Int J Mol Sci 2023 · <a target="_blank" href="https://pubmed.ncbi.nlm.nih.gov/${P.pmid}/">PMID ${P.pmid}</a> · <a target="_blank" href="https://doi.org/${P.doi}">doi</a></dd>
  <dt>Platform</dt><dd>${P.platform}</dd><dt>Sample</dt><dd>78-y male, de novo metastatic NEPC co-existing with ARPC (no treatment history)</dd>
  <dt>QC</dt><dd>${P.spots_in_tissue} in-tissue → ${P.spots_qc} spots (≥500 UMI); ${P.genes} genes (≥10 spots); median ${P.median_umi} UMI, ${P.median_genes} genes</dd>
  <dt>Processing</dt><dd>scanpy ${P.scanpy}: normalize_total 1e4 + log1p; score_genes; Leiden r=0.5; Wilcoxon NE vs AR (BH)</dd>
  <dt>AR program</dt><dd>${P.AR_genes.join(" ")}</dd><dt>NE program</dt><dd>${P.NE_genes.join(" ")}</dd>
  <dt>Code</dt><dd>analysis.py sha256:${P.analysis_sha256} · repo ${P.repo_commit}</dd>
  <dt>Display values</dt><dd>8-bit quantised per gene (≤0.4% of gene max)</dd></dl></div></div>`;
 viewer(val,d,sym);
}
function viewer(val,d,sym){const cv=$("#cv"),vw=$("#vw"),ctx=cv.getContext("2d"),tip=$("#tip");
 let mode="expr",cm="magma",op=.85,sz=1,hz=true,T={k:1,x:0,y:0};
 const vmax=Math.max(1e-6,[...val].sort((a,b)=>a-b)[Math.floor(.995*(val.length-1))]);
 function fit(){const W=vw.clientWidth,H=vw.clientHeight,k=Math.min(W/M.img.w,H/M.img.h)*.98;T={k,x:(W-M.img.w*k)/2,y:(H-M.img.h*k)/2}}
 function resize(){const r=devicePixelRatio||1;cv.width=vw.clientWidth*r;cv.height=vw.clientHeight*r;draw()}
 function color(i){if(mode=="region")return RCOL[M.region[i]];if(mode=="cl"){const c=[[79,140,255],[245,166,35],[52,211,153],[248,113,113],[167,139,250],[56,189,248],[251,113,133],[250,204,21],[45,212,191],[192,132,252],[253,186,116],[148,163,184]][M.leiden[i]%12];return `rgb(${c})`}
  const v=val[i];if(hz&&v<=0)return null;return `rgb(${cmap(cm,v/vmax)})`}
 function draw(){const r=devicePixelRatio||1;ctx.setTransform(r,0,0,r,0,0);ctx.fillStyle="#05070a";ctx.fillRect(0,0,cv.width,cv.height);
  ctx.setTransform(r*T.k,0,0,r*T.k,r*T.x,r*T.y);ctx.imageSmoothingQuality="high";ctx.globalAlpha=1;ctx.drawImage(img,0,0);
  if(mode!="he"){const rad=M.spot_px/2*sz;ctx.globalAlpha=op;
   const ord=mode=="expr"?[...val.keys()].sort((a,b)=>val[a]-val[b]):[...val.keys()];
   for(const i of ord){const c=color(i);if(!c)continue;ctx.fillStyle=c;ctx.beginPath();ctx.arc(M.x[i],M.y[i],rad,0,6.2832);ctx.fill()}}
  ctx.globalAlpha=1;
  // scale bar
  const ump=M.um_per_px/T.k,nice=[100,250,500,1000,2000].find(u=>u/ump>70)||2000;$("#scale").innerHTML=`<div style="width:${nice/ump}px"></div>${nice>=1000?nice/1000+" mm":nice+" µm"}`;
  $("#cbar").innerHTML=mode=="expr"?`${sym} · log1p<div class="bar" style="background:${grad(cm)}"></div><div class="ends"><span>0</span><span>${vmax.toFixed(2)}</span></div>`:mode=="region"?M.regions.map((g,i)=>`<div><i style="display:inline-block;width:8px;height:8px;border-radius:2px;background:${RCOL[i]};margin-right:6px"></i>${g}</div>`).join(""):mode=="cl"?"Leiden clusters 0–"+(M.clusters.length-1):"H&E (hires, "+M.img.w+"×"+M.img.h+" px)"}
 function zoom(f,cx,cy){const k=Math.max(.2,Math.min(40,T.k*f));f=k/T.k;T.x=cx-(cx-T.x)*f;T.y=cy-(cy-T.y)*f;T.k=k;draw()}
 cv.onwheel=e=>{e.preventDefault();const b=cv.getBoundingClientRect();zoom(Math.exp(-e.deltaY*.0015),e.clientX-b.left,e.clientY-b.top)};
 let drag=null;cv.onmousedown=e=>drag={x:e.clientX-T.x,y:e.clientY-T.y};window.onmouseup=()=>drag=null;
 cv.onmousemove=e=>{if(drag){T.x=e.clientX-drag.x;T.y=e.clientY-drag.y;draw();tip.style.display="none";return}
  const b=cv.getBoundingClientRect(),px=(e.clientX-b.left-T.x)/T.k,py=(e.clientY-b.top-T.y)/T.k,R2=(M.spot_px/2)**2*1.2;let best=-1,bd=1e9;
  for(let i=0;i<M.n;i++){const dx=M.x[i]-px,dy=M.y[i]-py,dd=dx*dx+dy*dy;if(dd<bd){bd=dd;best=i}}
  if(best<0||bd>R2){tip.style.display="none";return}
  tip.innerHTML=`<b>${sym}</b> ${val[best].toFixed(2)} log1p<br>${M.regions[M.region[best]]} · cluster ${M.clusters[M.leiden[best]]}<br>AR z ${M.AR_z[best]} · NE z ${M.NE_z[best]}<br><span style="color:#5d6878">${M.barcode[best]}</span>`;
  tip.style.display="block";tip.style.left=(e.clientX-b.left+14)+"px";tip.style.top=(e.clientY-b.top+14)+"px"};
 cv.onmouseleave=()=>tip.style.display="none";
 cv.ondblclick=e=>{const b=cv.getBoundingClientRect();zoom(2,e.clientX-b.left,e.clientY-b.top)};
 $("#zi").onclick=()=>zoom(1.5,vw.clientWidth/2,vw.clientHeight/2);$("#zo").onclick=()=>zoom(1/1.5,vw.clientWidth/2,vw.clientHeight/2);$("#zr").onclick=()=>{fit();draw()};
 document.querySelectorAll("#mode button").forEach(b=>b.onclick=()=>{mode=b.dataset.m;document.querySelectorAll("#mode button").forEach(x=>x.classList.toggle("on",x==b));draw()});
 document.querySelectorAll("#cm button").forEach(b=>b.onclick=()=>{cm=b.dataset.c;document.querySelectorAll("#cm button").forEach(x=>x.classList.toggle("on",x==b));draw()});
 $("#op").oninput=e=>{op=e.target.value/100;draw()};$("#sz").oninput=e=>{sz=e.target.value/100;draw()};$("#hz").onchange=e=>{hz=e.target.checked;draw()};
 window.onresize=resize;fit();resize();
 const U=new URLSearchParams(location.search),mm=U.get("mode");if(mm){const b=document.querySelector(`#mode button[data-m="${mm}"]`);b&&b.click()}const z=U.get("zoom");if(z){zoom(+z,vw.clientWidth*.3,vw.clientHeight*.4)}
}
boot();
</script></body></html>
