<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prostate Spatial Atlas · Vitessce · Novaflow</title>
<script type="importmap">{"imports":{"react":"https://esm.sh/react@18.2.0","react-dom":"https://esm.sh/react-dom@18.2.0","react-dom/client":"https://esm.sh/react-dom@18.2.0/client","vitessce":"https://unpkg.com/vitessce@3.5.1/dist/index.min.js"}}</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#05070a;--panel:#0d121a;--panel2:#111825;--line:#1b2330;--line2:#27313f;--tx:#e9eef6;--mut:#9aa6b6;--mut2:#5d6878;--blue:#4f8cff;--cyan:#38bdf8;--vio:#7c6cff;--ar:#4f8cff;--ne:#ec4899;--grn:#34d399;--amb:#f5a623;
--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;--sans:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font-family:var(--sans);-webkit-font-smoothing:antialiased;font-size:13px}
.top{height:48px;display:flex;align-items:center;gap:14px;padding:0 16px;border-bottom:1px solid var(--line);background:#0a0e13}
.top img{height:18px}.top .t{font-weight:640;font-size:13.5px;white-space:nowrap}.top .t span{color:var(--mut);font-weight:400}
.seg{display:flex;background:var(--panel);border:1px solid var(--line2);border-radius:9px;padding:3px;gap:2px}
.seg button{background:none;border:0;color:var(--mut);font:12px var(--sans);padding:5px 11px;border-radius:6px;cursor:pointer;white-space:nowrap;transition:background .2s,color .2s}
.seg button.on{background:linear-gradient(110deg,var(--blue),var(--vio));color:#fff}.seg button:hover:not(.on){color:var(--tx)}
.ask{flex:1;position:relative;min-width:240px}.ask input{width:100%;background:var(--panel);border:1px solid var(--line2);border-radius:9px;color:var(--tx);padding:7px 12px 7px 34px;font:12.5px var(--sans);outline:none}
.ask input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(56,189,248,.15)}.ask:before{content:"✦";position:absolute;left:12px;top:6px;color:var(--cyan)}
.top nav{display:flex;gap:12px;font-size:12px;white-space:nowrap}.top nav a{color:var(--mut);text-decoration:none}.top nav a:hover{color:var(--tx)}
.main{display:grid;grid-template-columns:1fr 370px;height:calc(100vh - 48px)}
#vit{position:relative;min-width:0;overflow:hidden}
.side{border-left:1px solid var(--line);background:#080b10;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:12px 13px;animation:in .45s cubic-bezier(.2,.8,.2,1) both}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.ch{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px}.ch .k{font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--mut2)}
.badge{font-family:var(--mono);font-size:9.5px;font-weight:700;letter-spacing:.06em;border-radius:5px;padding:2px 6px}.live{background:rgba(52,211,153,.14);color:var(--grn)}.pre{background:rgba(124,108,255,.16);color:#a99cff}
.card p{color:#cfd7e3;line-height:1.5;font-size:12.5px}.card b{color:#fff}.card .big{font-family:var(--mono);font-size:22px;font-weight:650}
.parsed{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0 8px}.parsed span{font-family:var(--mono);font-size:10.5px;color:var(--cyan);border:1px solid #173246;background:rgba(56,189,248,.06);border-radius:5px;padding:1px 6px}
.ex{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}.ex button{font:11px var(--sans);color:var(--mut);background:var(--panel2);border:1px solid var(--line2);border-radius:6px;padding:3px 8px;cursor:pointer}.ex button:hover{color:var(--tx);border-color:var(--cyan)}
.ins{display:grid;grid-template-columns:1fr 1fr;gap:8px}.ins div{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:8px 10px}.ins .v{font-family:var(--mono);font-size:17px;font-weight:650}.ins .l{font-size:11px;color:var(--mut);line-height:1.35;margin-top:2px}
.bars .r{display:grid;grid-template-columns:120px 1fr 54px;gap:7px;align-items:center;font-size:11.5px;margin:4px 0}.bars .tr{height:10px;background:var(--bg);border-radius:3px;overflow:hidden}.bars .tr i{display:block;height:100%;border-radius:3px}.bars .n{font-family:var(--mono);text-align:right;color:var(--mut)}
.verdict{margin-top:8px;font-size:12px;line-height:1.5}.verdict div{padding-left:18px;position:relative;margin:3px 0}.verdict div:before{position:absolute;left:0}
.ok:before{content:"✓";color:var(--grn)}.no:before{content:"✗";color:#f87171}.mid:before{content:"~";color:var(--amb)}
.note{font-size:10.8px;color:var(--mut2);margin-top:6px;line-height:1.4}
svg text{font-family:var(--mono);font-size:9px;fill:#9aa6b6}
#loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--mut)}

.side{border-left:1px solid #000;background:#000;overflow:auto;padding:6px 8px 12px;display:flex;flex-direction:column;gap:6px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.sec{background:#222;border-radius:4px;overflow:hidden}
.sec>summary{list-style:none;display:flex;align-items:center;gap:8px;padding:8px 10px;background:#000;color:#ddd;font-size:14px;cursor:pointer;user-select:none}
.sec>summary::-webkit-details-marker{display:none}
.sec>summary .chev{width:10px;color:#888;transition:transform .2s;font-size:10px}.sec[open]>summary .chev{transform:rotate(90deg)}
.sec>summary .tag{margin-left:auto;font-size:10px;letter-spacing:.06em;color:#8a8a8a;border:1px solid #333;border-radius:3px;padding:1px 5px}
.sec>summary .tag.live{color:#34d399;border-color:#1f4d3b}
.sb{padding:12px;color:#ccc;font-size:12.5px;line-height:1.45}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:8px 4px 2px;color:#8a8a8a}
.empty .ic{font-size:20px;color:#38bdf8}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:6px}
.chips button{font:11.5px inherit;font-family:inherit;color:#ccc;background:#2c2c2c;border:1px solid #3a3a3a;border-radius:12px;padding:3px 10px;cursor:pointer}.chips button:hover{border-color:#38bdf8;color:#fff}
.q{color:#fff;font-size:13px;font-weight:600;margin-bottom:6px}
.pchips{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px}.pchips span{font-size:10.5px;color:#9cc9e6;background:#1b2a35;border-radius:3px;padding:1px 6px}
.hero{display:flex;align-items:baseline;gap:8px;margin-bottom:4px}.hero b{font-size:24px;font-weight:600;color:#fff;font-variant-numeric:tabular-nums}.hero span{color:#999;font-size:12px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tile{background:#2a2a2a;border-radius:4px;padding:8px 10px}.tile .v{font-size:18px;font-weight:600;color:#fff;font-variant-numeric:tabular-nums;white-space:nowrap}.tile .l{font-size:11px;color:#999;margin-top:1px}
.hb{display:grid;grid-template-columns:96px 1fr 64px;gap:8px;align-items:center;font-size:11.5px;margin:5px 0;color:#bbb}
.hb .tr{height:8px;background:#333;border-radius:2px;overflow:hidden}.hb .tr i{display:block;height:100%}.hb .n{text-align:right;color:#ddd;font-variant-numeric:tabular-nums}
.vr{display:grid;grid-template-columns:16px 1fr;gap:6px;margin:6px 0;font-size:12px;color:#ccc}.vr .s{font-weight:700}.vr small{display:block;color:#888;font-size:11px}
.stack{display:flex;height:12px;border-radius:2px;overflow:hidden;margin:4px 0 10px}.stack i{display:block;height:100%}
.leg2{display:grid;grid-template-columns:10px 1fr auto auto;gap:4px 8px;align-items:center;font-size:11.5px;color:#bbb}.leg2 i{width:10px;height:10px;border-radius:2px}.leg2 .n{text-align:right;color:#ddd;font-variant-numeric:tabular-nums}.leg2 .p{text-align:right;color:#888;width:42px}
.foot{font-size:10.5px;color:#777;margin-top:8px}
.side svg text{font-family:inherit;font-size:10px;fill:#999}
</style></head><body>

function preset(p,keep){state.preset=p;state.view=VIEW[p];document.querySelectorAll("#presets button").forEach(b=>b.classList.toggle("on",b.dataset.p==p));

function lev(a,b){if(Math.abs(a.length-b.length)>2)return 9;const d=Array.from({length:a.length+1},(_,i)=>[i]);for(let j=1;j<=b.length;j++)d[0][j]=j;

const STOP=new Set("SHOW WHERE IS ARE THE A AN IN OF AND VS VERSUS NEAR WITHIN TO FROM HIGH LOW EXPRESSION EXPRESSED CELLS CELL SPOTS SPOT TUMOR TUMOUR REGION REGIONS COMPARE BETWEEN GENES GENE CORRELATED WITH SIMILAR LIKE UM MM MICRONS µM AR NE STROMA BOUNDARY EDGE INTERFACE NICHE AMPHICRINE DUAL ABSTAINED UNCERTAIN WHAT WHICH HOW TOP MOST CO EXPRESSING NEUROENDOCRINE ADENOCARCINOMA SMALL T-SCNC SCNC NEPC ME FOR ALL".split(" "));
function findGene(text){const toks=text.replace(/[^A-Za-z0-9\-\.]/g," ").split(/\s+/).filter(Boolean);
 for(const t of toks){const u=t.toUpperCase();if(u.length>1&&SYM[u]!=null&&!STOP.has(u))return {g:GI.rows[SYM[u]][0],how:"exact"};if(AL[u]&&!STOP.has(u))return {g:AL[u],how:"alias "+t}}
 if(/\bAR\b/.test(text)&&/(gene|express|where is ar|androgen receptor)/i.test(text)&&!/near|within|vs|versus/i.test(text))return {g:"AR",how:"exact"};
 let best=null;for(const t of toks){const u=t.toUpperCase();if(u.length<3||STOP.has(u))continue;const lim=u.length>=6?2:1;
  for(const r of GI.rows){const s=r[0].toUpperCase();if(Math.abs(s.length-u.length)>lim||s[0]!=u[0])continue;const d=lev(u,s);if(d<=lim&&(!best||d<best.d||(d==best.d&&r[6]>best.p)))best={g:r[0],d,p:r[6],how:`fuzzy "${t}"→${r[0]} (edit ${d})`}}}
 return best}
function regionGroups(text){const t=text.toLowerCase(),R=[];
 const add=(k,name,f)=>{const i=t.search(k);if(i>=0)R.push({i,name,f})};
 add(/\bar\b|adeno|androgen/,"AR region",i=>SP.region[i]==0);add(/\bne\b|neuroendo|small.?cell|t-?scnc|nepc/,"NE region",i=>SP.region[i]==5);

function answer(parsed,html){askQ=$("#q").value;OPEN.ask=true;askBody=`<div class="q">“${askQ}”</div><div class="pchips">${parsed.map(p=>`<span>${p}</span>`).join("")}</div>${html}<div class="foot">Computed in your browser from per-spot data.</div>`;side()}
async function ask(q){q=q.trim();if(!q)return;const t=q.toLowerCase(),G=findGene(q),R=regionGroups(q),D=dist(q);

 // intent: compare gene across regions

  setExtra("Query: "+G.g,ids);state.sel=ids.map(([n])=>["Query: "+G.g,n]);state.enc="geneSelection";state.gene=G.g;preset("arne",true);
  const fc=res.length>=2?Math.log2((res[1].mean+0.01)/(res[0].mean+0.01)):null;
  return answer(P,`<div class="hbars">${res.map((r,k)=>`<div class="hb"><span>${r.name}</span><span class="tr"><i style="width:${100*r.mean/mx}%;background:rgb(${[[79,140,255],[236,72,153],[245,166,35]][k]})"></i></span><span class="n">${r.mean.toFixed(2)}</span></div>`).join("")}</div>
   <p style="margin-top:6px">${res.map(r=>`${r.name}: mean log1p <b>${r.mean.toFixed(2)}</b>, detected in ${r.pct.toFixed(0)}% (n=${r.n})`).join("<br>")}${fc!=null?`<br>log2 ratio ${res[1].name}/${res[0].name}: <b>${fc.toFixed(2)}</b>`:""}</p>`)}

 // intent: show a state
 const stMap=[[/amphi|dual|hybrid/,2],[/abstain|uncertain|low.?conf/,-1],[/strom/,3],[/\bne\b|neuroendo|t-?scnc|small.?cell/,1],[/\bar\b|adeno/,0]];

  const idx=SP.barcode.map((_,i)=>i).filter(i=>(k==-1?SP.state[i]==-1:SP.state[i]==k)),md=idx.map(i=>SP.dist[i]).sort((a,b)=>a-b)[Math.floor(idx.length/2)]||0,mc=idx.reduce((s,i)=>s+SP.conf[i],0)/(idx.length||1);
  return answer(P,`<div class="hero"><b>${idx.length} </b><span>spots · ${pct(idx.length,N)}</span></div><p><b>${nm}</b>: median distance to AR <b>${md} µm</b>, mean voter agreement <b>${mc.toFixed(2)}</b>.</p>`)}}
 // intent: where is gene high
 if(G){P.unshift("intent: localize gene");const gi=SYM[G.g.toUpperCase()],v=await expr(gi),nz=[...v].filter(x=>x>0).sort((a,b)=>a-b);

  const thr=nz[Math.floor(.9*(nz.length-1))],hot=[];for(let i=0;i<N;i++)if(v[i]>=thr&&v[i]>0)hot.push(i);
  const byR=MT.regions.map((r,k)=>({r,n:hot.filter(i=>SP.region[i]==k).length,base:MT.region_n[k]})).sort((a,b)=>b.n-a.n);
  const enr=byR.map(x=>({...x,e:(x.n/hot.length)/(x.base/N)}));
  return answer(P,`<p><b>${G.g}</b> is detected in ${(100*nz.length/N).toFixed(1)}% of spots. Hotspots (top 10% of expressing spots, ≥${thr.toFixed(2)} log1p): <b>${hot.length}</b>.</p>
   <div class="hbars" style="margin-top:6px">${enr.slice(0,4).map(x=>`<div class="hb"><span>${x.r}</span><span class="tr"><i style="width:${100*x.n/hot.length}%;background:var(--cyan)"></i></span><span class="n">${x.n} · ${x.e.toFixed(1)}×</span></div>`).join("")}</div>
